# Build this fork's image on GitHub's runners and push it to GHCR, so the
# Coolify host only ever pulls. Asset precompile wants a ~4GB Node heap and
# every native gem is compiled from source (docker/Dockerfile sets
# force_ruby_platform), which is more than a small VPS wants to do on deploy.
#
# This is a new file rather than an edit to publish_foss_docker.yml so that
# upstream's workflows stay untouched and keep merging cleanly.

name: Publish fork image to GHCR

on:
  push:
    branches:
      - my-develop
    tags:
      - fork-v*
    # The compose file and docs are read by Coolify from the git clone, not
    # baked into the image, so changing them should not trigger a 40-minute
    # rebuild that produces an identical image.
    paths-ignore:
      - 'docker-compose*.yaml'
      - '**/*.md'
      # mailtrap-relay runs from a bind mount off the git clone, not from the
      # image, so editing it does not require a rebuild either.
      - 'docker/mailtrap-relay/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: docker/Dockerfile runs `git rev-parse HEAD > /app/.git_sha`,
        # which needs a real .git directory in the build context.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uncomment to ship a clean community image instead of gating the
      # enterprise code paths at runtime with DISABLE_ENTERPRISE=true.
      # - name: Strip enterprise code
      #   run: rm -rf enterprise spec/enterprise

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # amd64 only. Building arm64 here needs QEMU emulation, which turns a
          # slow build into a very slow one. If the Coolify host is arm64, add
          # `platforms: linux/amd64,linux/arm64` plus setup-qemu-action.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RAILS_ENV=production
            NODE_OPTIONS=--max-old-space-size=4096
          # Layer cache across runs; without it every push recompiles the gems.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed images"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
